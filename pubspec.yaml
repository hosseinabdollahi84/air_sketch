name: air_sketch
description: "Draw in the air with your fingertip using the front camera."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  get: ^4.7.3
  camera: ^0.12.1
  hand_landmarker: ^3.1.0
  google_mlkit_face_detection: ^0.15.1
  permission_handler: ^12.0.3
  gal: ^2.3.3
  http: ^1.6.0
  flutter_secure_storage: ^11.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
